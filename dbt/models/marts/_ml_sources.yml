version: 2

sources:
  - name: ml_outputs
    description: >
      Machine-learning and recommendation outputs generated by the Python
      customer segmentation and product recommendation pipelines.

    schema: ml

    tables:
      - name: customer_segments
        description: >
          One customer-segment assignment per customer produced by
          the K-Means segmentation model.

        columns:
          - name: customer_id
            description: Unique customer identifier.
            data_tests:
              - not_null
              - unique

          - name: account_id
            description: Account associated with the customer.
            data_tests:
              - not_null
              - unique

          - name: cluster_id
            description: Numeric cluster generated by K-Means.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [0, 1, 2, 3, 4]
                    quote: false

          - name: segment_name
            description: Business-friendly name assigned to the cluster.
            data_tests:
              - not_null

          - name: model_version
            description: Version of the model that generated the assignment.
            data_tests:
              - not_null

          - name: scored_at
            description: Timestamp when the segment assignment was generated.
            data_tests:
              - not_null

      - name: cluster_profiles
        description: >
          Aggregated behavioral and product-ownership statistics for
          the five customer segments.

        columns:
          - name: cluster_id
            description: Numeric cluster identifier.
            data_tests:
              - not_null
              - unique

          - name: segment_name
            description: Business-friendly segment name.
            data_tests:
              - not_null

          - name: customer_count
            description: Number of customers assigned to the segment.
            data_tests:
              - not_null

          - name: model_version
            description: Version of the segmentation model.
            data_tests:
              - not_null

      - name: product_recommendations
        description: >
          Ranked product and service recommendations generated using customer
          segments, account activity and existing product ownership.

        columns:
          - name: customer_id
            description: Customer receiving the recommendation.
            data_tests:
              - not_null

          - name: account_id
            description: Account associated with the recommendation.
            data_tests:
              - not_null

          - name: recommended_product
            description: Product or service recommended to the customer.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - Payment Card
                      - Personal Loan Consultation
                      - Savings Account
                      - Overdraft Protection
                      - Automatic Payment Setup
                      - Account Re-Engagement Review

          - name: recommendation_score
            description: Rule-based recommendation score from 0 to 100.
            data_tests:
              - not_null

          - name: recommendation_rank
            description: Recommendation position for the customer.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2, 3]
                    quote: false

          - name: recommendation_reason
            description: Human-readable explanation for the recommendation.
            data_tests:
              - not_null

          - name: recommendation_version
            description: Version of the recommendation rules.
            data_tests:
              - not_null

          - name: generated_at
            description: Timestamp when the recommendations were generated.
            data_tests:
              - not_null